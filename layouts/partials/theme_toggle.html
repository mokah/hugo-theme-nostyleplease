<button id="theme-toggle" aria-label="Toggle dark mode">
    <span class="theme-toggle-light">☀</span>
    <span class="theme-toggle-dark">☾</span>
</button>

<script>
    (function () {
        const toggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Get current theme from body attribute or default to auto
        function getCurrentTheme() {
            return body.getAttribute('a') || 'auto';
        }

        // Cycle through: auto -> light -> dark -> auto
        function cycleTheme() {
            const current = getCurrentTheme();
            let next;

            if (current === 'auto') {
                next = 'light';
            } else if (current === 'light') {
                next = 'dark';
            } else {
                next = 'auto';
            }

            body.setAttribute('a', next);
            localStorage.setItem('theme', next);
        }

        // Load saved theme on page load
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            body.setAttribute('a', savedTheme);
        }

        // Keep the <meta name="theme-color"> tags in sync with the effective
        // theme, so the browser UI matches the page even when the user has
        // overridden the system preference.
        const lightMeta = document.querySelector('meta[name="theme-color"][media*="light"]');
        const darkMeta = document.querySelector('meta[name="theme-color"][media*="dark"]');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)');

        function getEffectiveTheme() {
            const t = getCurrentTheme();
            return t === 'auto' ? (systemDark.matches ? 'dark' : 'light') : t;
        }

        function syncThemeMeta() {
            const active = getEffectiveTheme();
            lightMeta.media = active === 'light' ? 'all' : 'not all';
            darkMeta.media = active === 'dark' ? 'all' : 'not all';
        }

        toggle.addEventListener('click', () => {
            cycleTheme();
            syncThemeMeta();
        });
        systemDark.addEventListener('change', syncThemeMeta);
        syncThemeMeta();
    })();
</script>
