{{ define "main" }}
<main>
    <header>
        <h1 class="site-title"><a href="{{ `/` | relURL }}">{{ $.Site.Title }}</a></h1>
        {{- partial "theme_toggle.html" . -}}
        {{- if $.Site.Params.theme_config.show_description -}}
        <p>{{ $.Site.Params.description }}</p>
        {{- end -}}
    </header>
    {{ .Content }}
{{ partial "post_list_wrapper.html" . }}
    
</main>
{{ end }}
